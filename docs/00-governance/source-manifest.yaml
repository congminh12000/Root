  - id: SRC-008
    title: Board & Components (bản đồ Autumn)
    priority: P0
    role: Clearing, suit, slot, ruin, path, forest, góc bản đồ; số lượng quân (Law §C.1)
    verification: verified
    notes: >-
      Law §M.1 không có dữ liệu hình học. Đã trích từ hình bản đồ trong SRC-003 tr. 3 (ảnh nền sạch cho path và
      rừng, lớp walkthrough cho suit và ô slot) và SRC-002 tr. 5 (ô slot ở góc dưới phải). Kết quả ở
      packages/game-data/src/maps/autumn.ts và docs/03-data-spec/autumn.md. Media Kit chỉ có ảnh quảng bá.

