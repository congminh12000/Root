# File PDF không commit; tải lại và kiểm checksum bằng `npm run fetch:sources`.
# verification: verified = đã tải, checksum khớp, đã đối chiếu nội dung; inventoried = đã biết URL, chưa trích; pending = chưa có bản dùng được.
