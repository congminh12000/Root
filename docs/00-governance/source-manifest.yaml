  - id: SRC-004
    title: Root Rules & Errata (Leder Rules Library), printing p16
    version: "p16 (trang ghi Updated Oct 8, 2025)"
    priority: P0
    role: >-
      NGUỒN LUẬT CHÍNH từ 31/10/2026 (decisions/0005). Bản Law trực tuyến mới nhất, kèm 46 câu FAQ chính thức
      gắn vào từng điều khoản. SRC-001 (PDF) chỉ còn là bản đối chiếu và nguồn số trang.
    url: https://rules.ledergames.com/?product=root&locale=en-US&printing=p16
    file: docs/01-official-sources/base/rules-library-root-p16.json
    sha256: eaa8dbcb0feb2615f4eedcb34909da26cbaeadcbf256c58ac9064dbecb7d01fb
    regenerate: npm run snapshot:rules
    retrieved: "2026-10-31"
    verification: verified
    notes: >-
      Trang là ứng dụng web; dữ liệu luật nằm trong một object literal của bundle JS. scripts/snapshot-rules
      đọc nó bằng acorn (không chạy code) và ghi 811 điều khoản cùng 46 FAQ. Link trên trang Resources là
      printing=p1 nhưng tự chuyển sang p16; bundle còn có p4 và p6 (bản cũ, không dùng).
      So với PDF 13/10/2025 trong phạm vi base (283 điều khoản): nội dung luật trùng nhau, chỉ khác câu chữ ở
      §4.2 ("choose any number" thay cho "take any number") và G.4 (thêm câu định nghĩa cannot). OQ-02 đã đóng.

  - id: SRC-005
    title: Root Card Database (Leder Card Library)
    priority: P0
    role: Văn bản hiệu ứng, suit, chi phí chế tạo của 54 lá bài chung, 15 quest, leader, character
    url: https://cards.ledergames.com/
    feed: https://ledercards.netlify.app/cards.min.json
    feed_sha256: 5bcd6f14b3e3abb86c47b15bf3b028f6b6fbc971a77496d2b5bf37667cfccc63
    retrieved: "2026-10-31"
    verification: verified
    notes: >-
      Trang web đọc dữ liệu từ feed JSON trên (dạng nén compress-json; có 72 mục thuộc rootbasegame).
      Suit, chi phí, item, điểm và yêu cầu quest được đọc từ ảnh từng lá và ghi vào packages/game-data.
      Feed chỉ lưu mỗi mẫu bài một lần nên không có số bản sao (OQ-04). Không lưu ảnh bài vào repo.

