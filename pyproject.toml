[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "root"
version = "0.1.0"
description = "A local, spectator-only asymmetric strategy AI laboratory"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "websockets==15.0.1"]

[project.optional-dependencies]
train = ["torch==2.7.0", "numpy==2.2.5"]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8"]

[project.scripts]
root = "root.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
